[project]
name = "automation-agent"
version = "0.1.0"
description = "阿序 · Axu：基于 LangChain 与 LangGraph 的本机桌面 Agent"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "langchain>=1.2,<1.3",
    "langchain-deepseek>=1.0,<1.1",
    "langchain-openai>=1.1,<1.2",
    "langgraph>=1.1,<1.2",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
    "langsmith>=0.14,<0.15",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.46,<0.47",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.middleware", "agent.tools", "runtime"]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
]
desktop-build = [
    "pyinstaller>=6.19,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

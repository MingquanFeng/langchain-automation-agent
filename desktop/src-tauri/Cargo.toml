[package]
name = "automation-agent-desktop"
version = "0.1.0"
description = "Automation Agent 的 Tauri 桌面窗口"
authors = ["Automation Agent"]
edition = "2021"
build = "build.rs"

[lib]
# macOS 主程序与 Tauri 生成代码需要这些 crate 类型。
name = "automation_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# 在编译阶段读取 tauri.conf.json 并生成应用上下文。
tauri-build = { version = "2", features = [] }

[dependencies]
# 目录通过系统文件选择框授权；应用不开放通用文件系统或 Shell 权限。
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
